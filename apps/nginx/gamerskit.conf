upstream gk_api {
    server api:4000;
}

upstream gk_web {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    # Max upload size (product images via Cloudinary signed upload)
    client_max_body_size 20m;

    # ── Express API ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://gk_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # API health / root probe
    location ~ ^/(health|favicon\.ico)$ {
        proxy_pass http://gk_api;
    }

    # ── Next.js frontend ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://gk_web;
        proxy_http_version 1.1;
        # WebSocket headers (used by Next.js HMR in dev; harmless in prod)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Disable buffering so React Server Component streaming works correctly
        proxy_buffering    off;
        proxy_read_timeout 60s;
    }
}
